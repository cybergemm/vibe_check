<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Recap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='weekly_recap.css') }}">
</head>
<body class="recap-body">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card recap-card">
                    <div class="card-header recap-header">
                        <h2 class="text-center">Mood Recap</h2>
                        <p class="text-center text-muted">Your mood journey</p>
                    </div>
                    <div class="card-body">
                        <!-- Time Period Selector -->
                        <div class="row justify-content-center mb-4">
                            <div class="col-md-6">
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="timePeriod" id="weekly" value="weekly" checked>
                                    <label class="btn btn-outline-primary" for="weekly">Weekly</label>
                                    
                                    <input type="radio" class="btn-check" name="timePeriod" id="monthly" value="monthly">
                                    <label class="btn btn-outline-primary" for="monthly">Monthly</label>
                                </div>
                            </div>
                        </div>

                        <!-- User ID Form -->
                        <div id="user-form" class="mb-4">
                            <form id="userIdForm" class="row g-3 justify-content-center">
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="recapUserId" placeholder="Enter your unique identifier" required>
                                        <button class="btn btn-primary" type="submit">View Recap</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        
                        <div id="loading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading your mood data...</p>
                        </div>
                        
                        <div id="no-data" class="text-center d-none">
                            <div class="alert alert-info">
                                <h4>No mood data available</h4>
                                <p>Start tracking your mood to see your recap!</p>
                                <a href="/" class="btn btn-primary">Go to Mood Tracker</a>
                            </div>
                        </div>
                        
                        <!-- Weekly Recap Content -->
                        <div id="weekly-recap" class="d-none">
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="recap-stat-card">
                                        <h3>Most Common Mood</h3>
                                        <div class="stat-value" id="weekly-most-common-mood">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="recap-stat-card">
                                        <h3>Top Reasons</h3>
                                        <div class="stat-value" id="weekly-top-reasons">-</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Monthly Recap Content -->
                        <div id="monthly-recap" class="d-none">
                            <div class="row mb-4">
                                <div class="col-12">
                                    <div class="recap-stat-card">
                                        <h3>Mood Patterns</h3>
                                        <div id="monthly-mood-patterns" class="mt-3">
                                            <!-- Will be populated by JavaScript -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <a href="/" class="btn btn-primary">Back to Mood Tracker</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Define initialUserId variable
        const initialUserId = "{{ user_id }}";
    </script>
    <script src="{{ url_for('static', filename='recap.js') }}"></script>
</body>
</html>
