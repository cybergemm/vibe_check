<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center">Mood Tracker</h2>
                    </div>
                    <div class="card-body">
                        <form id="moodForm" novalidate>
                            <div class="mb-3">
                                <label for="userId" class="form-label">Your Unique Identifier</label>
                                <input type="text" class="form-control" id="userId" required>
                                <div class="invalid-feedback">Please enter your unique identifier</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">How are you feeling?</label>
                                <div class="mood-buttons">
                                    <button type="button" class="btn btn-mood" data-mood="happy">Happy</button>
                                    <button type="button" class="btn btn-mood" data-mood="sad">Sad</button>
                                    <button type="button" class="btn btn-mood" data-mood="angry">Angry</button>
                                    <button type="button" class="btn btn-mood" data-mood="tired">Tired</button>
                                    <button type="button" class="btn btn-mood" data-mood="scared">Scared</button>
                                </div>
                                <div class="invalid-feedback">Please select your mood</div>
                                <input type="hidden" id="selectedMood" name="mood" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Why are you feeling this way? (Optional)</label>
                                <div class="reasons-container">
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Went outside" id="reason1">
                                        <label class="form-check-label" for="reason1">Went outside</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Took care of their health" id="reason2">
                                        <label class="form-check-label" for="reason2">Took care of their health</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Played video games" id="reason3">
                                        <label class="form-check-label" for="reason3">Played video games</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="School/work/study/productivity" id="reason4">
                                        <label class="form-check-label" for="reason4">School/work/study/productivity</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Had good food or drinks" id="reason5">
                                        <label class="form-check-label" for="reason5">Had good food or drinks</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Had bad food or drinks" id="reason6">
                                        <label class="form-check-label" for="reason6">Had bad food or drinks</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Travelled" id="reason7">
                                        <label class="form-check-label" for="reason7">Travelled</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Socialised" id="reason8">
                                        <label class="form-check-label" for="reason8">Socialised</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Listened to music" id="reason9">
                                        <label class="form-check-label" for="reason9">Listened to music</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Watched a film or television show" id="reason10">
                                        <label class="form-check-label" for="reason10">Watched a film or television show</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Read" id="reason11">
                                        <label class="form-check-label" for="reason11">Read</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Did art" id="reason12">
                                        <label class="form-check-label" for="reason12">Did art</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Rested" id="reason13">
                                        <label class="form-check-label" for="reason13">Rested</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input reason-checkbox" type="checkbox" value="Did errands" id="reason14">
                                        <label class="form-check-label" for="reason14">Did errands</label>
                                    </div>
                                </div>
                                <input type="hidden" id="selectedReasons" name="reasons">
                            </div>
                            
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>
                        <div id="message" class="mt-3 text-center"></div>
                        
                        <div class="text-center mt-4">
                            <a href="/recap" class="btn btn-outline-primary">View Mood Recap</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
