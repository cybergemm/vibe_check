<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Mood Recap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='weekly_recap.css') }}">
</head>
<body class="recap-body">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card recap-card">
                    <div class="card-header recap-header">
                        <h2 class="text-center">Weekly Mood Recap</h2>
                        <p class="text-center text-muted">Your mood journey this week</p>
                    </div>
                    <div class="card-body">
                        <!-- User ID Form -->
                        <div id="user-form" class="mb-4">
                            <form id="userIdForm" class="row g-3 justify-content-center">
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="recapUserId" placeholder="Enter your unique identifier" required>
                                        <button class="btn btn-primary" type="submit">View Recap</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        
                        <div id="loading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading your weekly mood data...</p>
                        </div>
                        
                        <div id="no-data" class="text-center d-none">
                            <div class="alert alert-info">
                                <h4>No mood data available for this week</h4>
                                <p>Start tracking your mood to see your weekly recap!</p>
                                <a href="/" class="btn btn-primary">Go to Mood Tracker</a>
                            </div>
                        </div>
                        
                        <div id="recap-content" class="d-none">
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="recap-stat-card">
                                        <h3>Best Day</h3>
                                        <div class="stat-value" id="best-day">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="recap-stat-card">
                                        <h3>Worst Day</h3>
                                        <div class="stat-value" id="worst-day">-</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="recap-stat-card">
                                        <h3>Most Common Mood</h3>
                                        <div class="stat-value" id="most-common-mood">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="recap-stat-card">
                                        <h3>Top Reasons</h3>
                                        <div class="stat-value" id="top-reasons">-</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="text-center mt-4">
                                <a href="/" class="btn btn-primary">Back to Mood Tracker</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Define initialUserId variable
        const initialUserId = "{{ user_id }}";
    </script>
    <script src="{{ url_for('static', filename='weekly_recap.js') }}"></script>
</body>
</html>
