{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h3>Settings</h3>
  <form id="settingsForm">
    <div class="mb-3">
      <label for="privacySelect" class="form-label">Who can see your mood analysis?</label>
      <select id="privacySelect" name="privacy_setting" class="form-select">
        <option value="friends">Friends</option>
        <option value="nobody">Nobody</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
<div class="container">
    <h2>Change Password</h2>
    <form method="POST" action="{{ url_for('main.change_password') }}">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" name="current_password" id="current_password" class="form-control" required>
      </div>
  
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" class="form-control" required>
      </div>
  
      <div class="form-group">
        <label for="confirm_new_password">Confirm New Password</label>
        <input type="password" name="confirm_new_password" id="confirm_new_password" class="form-control" required>
      </div>
  
      <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
  </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Pre-fill setting from server
  fetch('/api/user_settings')
    .then(response => response.json())
    .then(data => {
      document.getElementById('privacySelect').value = data.privacy_setting;
    });

  document.getElementById('settingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const setting = document.getElementById('privacySelect').value;

    fetch('/api/user_settings', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ privacy_setting: setting })
    })
    .then(res => res.json())
    .then(data => alert(data.message || 'Saved!'))
    .catch(err => console.error('Error saving setting', err));
  });
});
</script>
{% endblock %}
