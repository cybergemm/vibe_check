<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vibe Check</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/login_stylesheet.css">
</head>
<body>
    <main class="background-wrapper d-flex justify-content-center align-items-center min-vh-100"> <!-- This is for centreing elements of the webpage.-->
        <div class="login-card card p-4 shadow-lg">
            <form action="/login" title="" method="post">
                <div class="text-center mb-3">
                    <img src="vibecheck.png" alt="Vibe Check logo" width="80" height="80">
                    <h1 class="welcome-heading">Welcome back</h1>
                    <p class="signup-text">
                        New to Vibe Check? <a class="link-blue" href="/signup">Sign up</a>
                    </p>
                </div>

                <fieldset>
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label">Username:</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-person-circle"></i></span>
                            <input type="text" class="form-control form-input" id="username" placeholder="Enter your username" required/>
                        </div>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Password (8 characters minimum):</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control form-input" id="password" placeholder="Enter your password" required/>
                        </div>
                    </div>

                    <div class="mb-3 text-end">
                        <a href="/forgot-password" class="link-blue">Forgot password?</a>
                    </div>
                </fieldset>

                <div class="text-center">
                    <button type="submit" class="btn login-button">Log in</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
