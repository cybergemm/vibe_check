<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Vibe Check</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/login_stylesheet.css">
</head>
<body>
    <main class="background-wrapper d-flex justify-content-center align-items-center min-vh-100"> <!-- This is for centreing elements of the webpage.-->
        <div class="login-card card p-4 shadow-lg">
            <form action="/signup" title="Enter the following details to create a new account." method="POST">
                <div class="text-center mb-3">
                    <img src="vibecheck.png" alt="Vibe Check logo" width="80" height="80">
                    <h1 class="welcome-heading">Create an account</h1>
                    <p class="signup-text">
                        Already have an account? <a class="link-blue" href="/login">Log in</a>
                    </p>
                </div>

                <fieldset>
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label">Email:</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-envelope-fill"></i></span>
                            <input name="email" type="email" class="form-control form-input" id="email" placeholder="Enter your email" required/>
                        </div>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="phone" class="form-label">Phone Number:</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-telephone-fill"></i></span>
                            <input name="phone" type="tel" class="form-control form-input" id="phone" placeholder="Enter your phone number" required/>
                        </div>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="fullname" class="form-label">Full Name:</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-person-circle"></i></span>
                            <input name="phone" type="text" class="form-control form-input" id="fullname" placeholder="Enter your full name" required/>
                        </div>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label">Username (6 characters minimum):</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-person-circle"></i></span>
                            <input name="username" type="text" class="form-control form-input" id="username" placeholder="Enter your username" minlength="6" required/>
                        </div>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Password (8 characters minimum):</label>
                        <div class="input-group">
                            <span class="input-group-text icon-box"><i class="bi bi-lock-fill"></i></span>
                            <input name="password" type="password" class="form-control form-input" id="password" placeholder="Enter your password" minlength="8" required/>
                        </div>
                    </div>
                </fieldset>

                <div class="text-center">
                    <button type="submit" class="btn login-button">Sign up</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
