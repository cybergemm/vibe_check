<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vibe Check</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="login_stylesheet.css">
</head>
<body>
    <div class="background-wrapper d-flex justify-content-center align-items-center min-vh-100"></div> <!-- This is for centreing elements of the webpage.-->
    <main class="w-100 d-flex justify-content-center align-items-center"> <!-- This is for centreing the content of the webpage (form).-->
        <div class="login-card card p-4 shadow-lg">
        <form action="/login" method="post">
            <div class="text-center mb-3">
            <img src="vibecheck.png" alt="Vibe Check logo" width="80" height="80">
            
            <h1 class="welcome-heading">Welcome back</h1>
            <p class="signup-text">
                New to Vibe Check? <a href="/signup">Sign up</a>
            </p>
            </div>

            <div class="form-field">
                <label for="username">
                    <img src="user_icon.png" width="18" alt="User icon">
                </label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="form-field">
                <label for="password">
                    <img src="password_icon.png" width="18" alt="Password icon">
                </label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-actions">
                <button type="submit">Log in</button>
            </div>

            <div class="forgot-password">
                <a href="/forgot-password">Forgot password?</a>
            </div>
        </form>
    </div>
    </main>
</body>
</html>
