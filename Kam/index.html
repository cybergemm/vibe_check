<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vibe Check</title>

    <link rel="stylesheet" href="login_stylesheet.css">
</head>
<body>
    <main class="form-box">
        <form action="/login" method="post">
            <img src="vibecheck.png" alt="Vibe Check logo" width="80" height="80">
            
            <h1 class="form-heading">Welcome back</h1>
            <p class="signup-text">
                New to VibeCheck? <a href="/signup">Sign up</a>
            </p>

            <div class="form-field">
                <label for="username">
                    <img src="user_icon.png" width="18" alt="User icon">
                </label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="form-field">
                <label for="password">
                    <img src="password_icon.png" width="18" alt="Password icon">
                </label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-actions">
                <button type="submit">Log in</button>
            </div>

            <div class="forgot-password">
                <a href="/forgot-password">Forgot password?</a>
            </div>
        </form>
    </main>
</body>
</html>
