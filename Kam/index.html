<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="login_stylesheet.css">
    <title>Login page</title>
</head>
<body>
    <div class="form-box">
        <form>
            <img src="vibecheck.png" alt="VibeCheck logo" width="80px">
            <h1>Welcome back, Log in!</h1>
            <h2>New to VibeCheck? <a href="">Sign up</a>.</h2>

            <div class="form-field">
                <img src=user_icon.png width="18">
                <input placeholder="Username">
            </div>

            <div class="form-field">
                <img src=password_icon.png width="18">
                <input placeholder="Password">
            </div>

            <div>
                <button>Login</button>
            </div>

            <div>
                <a href="">Forgot password?</a>
            </div>
        </form>
    </div>

</body>
</html>
